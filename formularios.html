<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios en HTML</h1>
    <p>Los formularios permiten que los usuarios escriban informacion y seleccionen opciones dentro de una pagina web.</p>

    <h2>Ejemplo de formulario</h2>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo">
        <br><br>

        <input type="submit" value="Enviar">
    </form>

    <p>Este formulario muestra campos para escribir, pero no almacena la informacion automaticamente.</p>

    <p><a href="index.html">Volver al menu principal</a></p>
</body>
</html>
