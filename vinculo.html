    <h1>Hipervinculos en HTML</h1>
    <p>Los hipervinculos permiten navegar de una pagina a otra o abrir sitios de internet.</p>

    <h2>Sintaxis</h2>
    <pre>
&lt;a href="index.html"&gt;Volver al inicio&lt;/a&gt;
    </pre>

    <p><a href="https://www.google.com">Abrir Google</a></p>

    <p>El atributo href indica la direccion a la que lleva el enlace.</p>

    <p><a href="index.html">Volver al menu principal</a></p>
